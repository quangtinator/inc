<div id="erd" style="padding: 0.5rem 0"></div>
<script type="module">
  import mermaid from "https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs";
  const dark = false; // matchMedia("(prefers-color-scheme: dark)").matches;
  await document.fonts.ready;
  mermaid.initialize({
    startOnLoad: false,
    theme: "base",
    fontFamily: '"Anthropic Sans", sans-serif',
    themeVariables: {
      darkMode: dark,
      fontSize: "13px",
      fontFamily: '"Anthropic Sans", sans-serif',
      lineColor: dark ? "#9c9a92" : "#73726c",
      textColor: dark ? "#c2c0b6" : "#3d3d3a",
    },
  });
  const { svg } = await mermaid.render(
    "erd-svg",
    `erDiagram
  TENANT ||--o{ MACHINE : "1 to 0..N"
  TENANT ||--o{ USER : "1 to 0..N"
  TENANT ||--o{ OPTIMIZATION_REQUEST : "1 to 0..N"
  TENANT ||--o{ RECOMMENDATION : "1 to 0..N"
  TENANT ||--o{ FEEDBACK : "1 to 0..N"
  MACHINE ||--o{ OPTIMIZATION_REQUEST : "1 to 0..N"
  USER ||--o{ OPTIMIZATION_REQUEST : "1 to 0..N"
  USER ||--o{ FEEDBACK : "1 to 0..N"
  OPTIMIZATION_REQUEST ||--|| RECOMMENDATION : "1 to 1"
  RECOMMENDATION ||--o| FEEDBACK : "1 to 0..N"
  ALGORITHM_VERSION ||--o{ RECOMMENDATION : "1 to 0..N"

  TENANT {
    uuid id PK
    string name
    timestamp created_at
  }
  MACHINE {
    uuid id PK
    uuid tenant_id FK
    string name
    boolean is_active
  }
  USER {
    uuid id PK
    uuid tenant_id FK
    string email
    string role
    boolean is_active
  }
  OPTIMIZATION_REQUEST {
    uuid id PK
    uuid tenant_id FK
    uuid machine_id FK
    uuid user_id FK
    string material_type
    jsonb material_properties
    jsonb environment_params
    jsonb optimization_goals
    string status
    timestamp created_at
  }
  RECOMMENDATION {
    uuid id PK
    uuid tenant_id FK
    uuid request_id FK
    uuid algorithm_version_id FK
    jsonb output_params
    timestamp computed_at
  }
  FEEDBACK {
    uuid id PK
    uuid tenant_id FK
    uuid recommendation_id FK
    uuid user_id FK
    int rating
    text comment
    timestamp submitted_at
  }
  ALGORITHM_VERSION {
    uuid id PK
    string version_tag
    string endpoint_url
    boolean is_active
    timestamp deployed_at
  }
`,
  );
  document.getElementById("erd").innerHTML = svg;
  document.querySelectorAll("#erd svg.erDiagram .node").forEach((node) => {
    const firstPath = node.querySelector("path[d]");
    if (!firstPath) return;
    const d = firstPath.getAttribute("d");
    const nums = d.match(/-?[\d.]+/g)?.map(Number);
    if (!nums || nums.length < 8) return;
    const xs = [nums[0], nums[2], nums[4], nums[6]];
    const ys = [nums[1], nums[3], nums[5], nums[7]];
    const x = Math.min(...xs),
      y = Math.min(...ys);
    const w = Math.max(...xs) - x,
      h = Math.max(...ys) - y;
    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("x", x);
    rect.setAttribute("y", y);
    rect.setAttribute("width", w);
    rect.setAttribute("height", h);
    rect.setAttribute("rx", "8");
    for (const a of ["fill", "stroke", "stroke-width", "class", "style"]) {
      if (firstPath.hasAttribute(a))
        rect.setAttribute(a, firstPath.getAttribute(a));
    }
    firstPath.replaceWith(rect);
  });
  document
    .querySelectorAll(
      "#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path",
    )
    .forEach((p) => {
      p.setAttribute("stroke", "none");
    });
</script>
